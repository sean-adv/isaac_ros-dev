dinov3_cases:
  ros__parameters:
    # Select a precomputed profile from config/omdet_prompts.json.
    grounding_prompt: 'Detect medicine bottle, medicine box.'
    grounding_box_threshold: 0.3
    grounding_nms_iou: 0.5
    grounding_max_detections: 20
    # Original-image bbox after clipping/rounding; pixels / pixels squared.
    # 0 disables each threshold. All enabled thresholds must be met (>=).
    grounding_min_bbox_width: 80
    grounding_min_bbox_height: 80
    grounding_min_bbox_area: 0
    recognition_threshold: 0.8
    recognition_margin: 0.05
    # Keep IDs across 6 missed inference frames; expand each ROI by 50% per side.
    tracking_max_missed: 6
    tracking_roi_padding: 0.6
    # Show bbox only when BOTH strict thresholds are exceeded (>).
    # Count unique inference frames since this track's first detection, including misses.
    tracking_bbox_min_hit_ratio: 0.8
    tracking_bbox_min_detections: 10
    # Both modes use fixed 224×224 DINOv3 inputs; paths are selected by run.sh.
    inference_hz: 0.0
    preview_max_width: 960
    jpeg_quality: 80
    # Registered IR-derived depth in the RGB optical frame; 16UC1 mm / 32FC1 m.
    pose_enabled: true
    depth_topic: /camera/depth/image_raw
    depth_camera_info_topic: /camera/depth/camera_info
    pose_sync_tolerance: 0.05
    pose_min_depth: 0.1
    pose_max_depth: 5.0
    pose_depth_band: 0.08
    pose_min_points: 80
    pose_axis_ratio: 1.15
