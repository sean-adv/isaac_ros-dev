dinov3_cases:
  ros__parameters:
    # SAM3: 1–4 comma-separated class names; text features cached per prompt.
    grounding_prompt: 'medicine box.'
    grounding_box_threshold: 0.3
    # After KCF merging: intersection / smaller-box area >= threshold keeps the
    # larger box and immediately removes the smaller track. One final pass only.
    # Range 0..1; 0 disables containment filtering. Restart to apply.
    grounding_containment_threshold: 0.8
    grounding_nms_iou: 1.0  # IoU NMS disabled; containment filtering still applies.
    grounding_max_detections: 20
    # Submit one background SAM3 + DINO job every N processed frames; KCF continues.
    # One job at a time; seed and each catch-up update use latest admitted RGB.
    # DINO classifies SAM3 seed-frame crops before replay; boxes/labels hand off together.
    # 1 disables KCF and uses synchronous SAM3. Lost tracking requests detection early.
    grounding_detection_interval: 30
    # KCF crop: expand each side by this fraction; clip to image bounds.
    # Recenter/reinitialize only within 10% of box size (min 1px) of an artificial
    # ROI edge; physical image edges do not trigger it. Restart to apply.
    kcf_roi_padding: 1.0
    # Resize only each KCF working ROI; SAM3/Cat2Real/depth keep original pixels.
    # 0 restores full-resolution tracking. Keep >=16 target pixels where possible.
    kcf_max_roi_side: 300
    # Serial catch-up call limit; skip intermediate frames. No elapsed-time limit.
    # Persistent workers freeze after one latest-snapshot replay; foreground
    # reconciles to its current frame before committing the new generation.
    # Restart to apply.
    kcf_replay_max_frames: 100
    # Retire after N consecutive committed SAM3 misses; 1 retires on the first miss.
    # Elapsed time alone does not retire tracks; KCF does not reset the miss count.
    # Config only; restart to apply.
    kcf_max_missed_detections: 1
    # Fixed SAM3-seed Lab reference, checked on each unique KCF frame (48x48 crop).
    # Similarity 0..1; N consecutive values below threshold drop the track and
    # request SAM3 early, independently of SAM3 misses. 0 disables the check.
    # Higher threshold is stricter; calibrate for scene/lighting. Restart to apply.
    kcf_lab_similarity_threshold: 0.35
    kcf_lab_change_confirmations: 3
    # OpenCV internal pool in the main process; independent workers remain concurrent.
    # 0 preserves the library default. Restart to apply.
    opencv_num_threads: 1
    # Persistent KCF owners shared by foreground and replay; restart to apply.
    # Every Tracking ID maps to ID % workers, including one object. No CPU affinity.
    kcf_parallel_enabled: true
    kcf_parallel_workers: 4
    # Moving average over raw SAM3/KCF boxes per object; 1 disables smoothing.
    # Counts unique processed frames. Config only; restart after changes.
    bbox_smoothing_frames: 1
    # Original-image bbox after clipping/rounding; pixels / pixels squared.
    # 0 disables each threshold. All enabled thresholds must be met (>=).
    grounding_min_bbox_width: 0
    grounding_min_bbox_height: 0
    grounding_min_bbox_area: 0
    recognition_threshold: 0.8
    recognition_margin: 0.05
    # Cat2Real ViT-L/16 uses fixed 384×384 inputs; run.sh selects the Torch-TensorRT artifact.
    inference_hz: 0.0
    # One 960x540 overlay + H.264 encode shared by WebRTC and ROS. Restart to apply.
    video_fps: 30
    h264_bitrate: 2000000
    h264_encoder: auto  # NVENC first; libx264 fallback. Can explicitly select either.
    h264_topic: /medicine_recognition/image_annotated/h264
    # RViz2 Image display: raw 960x540 BGR overlay, published only when subscribed.
    annotated_image_topic: /medicine_recognition/image_annotated
    bbox_visualization_mode: "3d"
    # Registered IR-derived depth in the RGB optical frame; 16UC1 mm / 32FC1 m.
    # Legacy pose_* names now configure corner/nearest-depth 3D boxes.
    pose_enabled: true
    image_topic: /camera/camera/color/image_raw
    depth_topic: /camera/camera/depth/image_raw
    depth_camera_info_topic: /camera/camera/depth/camera_info
    pose_sync_tolerance: 0.2
    pose_min_depth: 0.15
    pose_max_depth: 2.0
    # Foreground depth tolerance around the central patch median (meters).
    # Full 3D center/size/rotation in background; independent of SAM3 interval.
    # Measure first processed RGB frame, then every 5 unique processed frames.
    bbox3d_interval: 3
    bbox3d_max_age: 1.5
    bbox3d_depth_band: 0.08
    bbox3d_min_points: 80
    # Trim box-local axes at the configured quantiles; 0 uses full bounds.
    bbox3d_quantile: 0.05
    # Reject sparse/depth-jumping components after Z quantile trimming, before RANSAC.
    bbox3d_min_cloud_coverage: 0.15  # retained points / clipped bbox pixels
    bbox3d_min_coverage_ratio: 0.35  # relative to last accepted coverage
    bbox3d_max_depth_jump: 0.10  # meters
    bbox3d_depth_confirmations: 3  # distinct depth frames; sparse fragments stay rejected
