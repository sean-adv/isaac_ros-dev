dinov3_cases:
  ros__parameters:
    pipeline: grounded
    grounding_backend: trt
    grounding_engine_path: /workspaces/isaac_ros-dev/dinov3_ws/artifacts/tensorrt/grounding_dino_wingdzero_fp16.engine
    grounding_model_id: IDEA-Research/grounding-dino-tiny
    grounding_prompt: 'medicine bottle. medicine box. bottle. box.'
    grounding_box_threshold: 0.3
    grounding_text_threshold: 0.25
    grounding_nms_iou: 0.5
    grounding_max_detections: 20
    recognition_threshold: 0.75
    recognition_margin: 0.05
    object_max_side: 224
    object_square_input: true
    # Reference image long-edge limit. 0 keeps the original resolution.
    # Aspect ratio is preserved and smaller images are not enlarged.
    # Can not to big (640) or the border will be cropped and the recognize will be wrong.
    reference_max_side: 224
    # Add target context before inference; crop features back to original coordinates.
    # Padding must be a multiple of the model feature stride; 0 disables it.
    target_padding: 0
    target_padding_mode: reflect
