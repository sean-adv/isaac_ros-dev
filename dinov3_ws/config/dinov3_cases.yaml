dinov3_cases:
  ros__parameters:
    # SAM3: 1–4 comma-separated class names; text features cached per prompt.
    grounding_prompt: 'medicine bottle, box.'
    grounding_box_threshold: 0.7
    grounding_nms_iou: 1.0  # SAM3 default: no NMS
    grounding_max_detections: 20
    # Original-image bbox after clipping/rounding; pixels / pixels squared.
    # 0 disables each threshold. All enabled thresholds must be met (>=).
    grounding_min_bbox_width: 0
    grounding_min_bbox_height: 0
    grounding_min_bbox_area: 0
    recognition_threshold: 0.85
    recognition_margin: 0.05
    # Frame-local bbox detections; enable explicitly if ROI tracking is wanted.
    tracking_enabled: false
    # When enabled: keep IDs across 6 missed inference frames; expand each ROI by 50% per side.
    tracking_max_missed: 6
    tracking_roi_padding: 0.6
    # Show bbox only when BOTH strict thresholds are exceeded (>).
    # Count unique inference frames since this track's first detection, including misses.
    tracking_bbox_min_hit_ratio: 0.8
    tracking_bbox_min_detections: 6
    # ViT-B/16 uses fixed 224×224 inputs; run.sh selects the Torch-TensorRT artifact.
    inference_hz: 0.0
    preview_max_width: 960
    jpeg_quality: 80
    # Registered IR-derived depth in the RGB optical frame; 16UC1 mm / 32FC1 m.
    # Legacy pose_* names now configure corner/nearest-depth 3D boxes.
    pose_enabled: true
    depth_topic: /camera/depth/image_raw
    depth_camera_info_topic: /camera/depth/camera_info
    pose_sync_tolerance: 0.2
    pose_min_depth: 0.1
    pose_max_depth: 5.0
    # Foreground depth tolerance around the central patch median (meters).
    bbox3d_depth_band: 0.08
    bbox3d_min_points: 80
    # Trim each XYZ axis at 2% / 98%; 0 uses the full component bounds.
    bbox3d_quantile: 0.02
