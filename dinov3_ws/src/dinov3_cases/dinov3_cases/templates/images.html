<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>圖片管理 · HSV 去背</title>
<link rel="stylesheet" href="/static/images.css">
</head>
<body>
<main>
<header>
<div>
<h1>圖片管理 · HSV 去背</h1>
<p class="muted">依標籤整理圖片，點選背景取色，再產生透明 PNG。</p>
</div>
<a href="/">{{ home_label }}</a>
</header>
<section>
<h2>匯入圖片</h2>
<form id="upload">
<input name="case" id="upload-case" aria-label="上傳標籤" placeholder="標籤，例如 medicine_01" required pattern="[A-Za-z0-9_-]{1,80}" list="case-list">
<input name="images" type="file" accept="image/png,image/jpeg,image/webp,image/bmp" multiple required>
<button id="upload-button">上傳到標籤</button>
</form>
<datalist id="case-list">
</datalist>
<p>
<small>標籤支援英文、數字、底線、連字號。去背會新增圖片，原圖保留。</small>
</p>
</section>
<p id="message" role="status" aria-live="polite">
</p>
<div class="layout">
<section>
<h2>標籤與圖片</h2>
<div class="toolbar">
<select id="cases" aria-label="篩選標籤">
<option value="">請選擇標籤</option>
</select>
<button id="reload">重新整理</button>
</div>
<p id="count" class="muted">
</p>
<div id="gallery" class="gallery">
</div>
</section>
<section>
<h2>點選背景取色</h2>
<p id="filename" class="muted">先從左側選擇圖片。</p>
<div class="views">
<div class="view">
<p>原圖 · 點選背景</p>
<div class="imagebox checker">
<canvas id="original" hidden aria-label="點選原圖背景取色">
</canvas>
</div>
</div>
<div class="view">
<p>去背預覽 · 棋盤格表示透明</p>
<div class="imagebox checker">
<img id="preview" hidden alt="透明背景預覽">
</div>
</div>
</div>
<p>
<span id="sample">
</span> <span id="sample-text">尚未選擇背景色</span>
</p>
<div class="controls">
<label>H 色相容差：<output id="hue-out">15</output>°<input id="hue" type="range" min="0" max="180" value="15">
</label>
<label>S 飽和度容差：<output id="saturation-out">50</output>
<input id="saturation" type="range" min="0" max="255" value="50">
</label>
<label>V 亮度容差：<output id="value-out">50</output>
<input id="value" type="range" min="0" max="255" value="50">
</label>
<label>邊緣柔化：<output id="feather-out">0</output> px<input id="feather" type="range" min="0" max="10" step="0.5" value="0">
</label>
</div>
<label>
<input id="connected" type="checkbox" checked> 僅去除與取色位置連通的背景區域</label>
<p>
<small>取消勾選會去除全圖相近顏色。物體與背景顏色相近時，請降低容差；斷開的背景可儲存後再點選去除。</small>
</p>
<label>新圖片的標籤 <input id="target-case" placeholder="預設使用原圖標籤" pattern="[A-Za-z0-9_-]{1,80}" list="case-list">
</label>
<div class="toolbar">
<button id="save" disabled>儲存新的透明 PNG</button>
<a id="download" hidden download="cutout.png">下載預覽</a>
<button id="delete" class="danger" disabled>刪除此圖片</button>
</div>
</section>
</div>
</main>
<script src="/static/images.js">
</script>
</body>
</html>
