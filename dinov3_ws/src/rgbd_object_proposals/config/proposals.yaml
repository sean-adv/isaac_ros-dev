# 深度必须对齐 RGB；background_depth 以米为单位设置背景平面深度。
# 参数为启动时只读设置；修改后重新启动。
rgbd_object_proposal_node:
  ros__parameters:
    rgb_topic: /camera/color/image_raw
    depth_topic: /camera/depth/image_raw
    camera_info_topic: /camera/color/camera_info
    sync_queue_size: 10
    sync_slop: 0.05
    camera_info_max_age: 0.0
    publish_debug_image: true
    publish_pointcloud: false
    min_depth: 0.15
    max_depth: 2.0
    depth_scale: 0.001
    pixel_stride: 2
    roi:
    - 0
    - 0
    - 0
    - 0
    background_depth: 1.1
    foreground_threshold: 0.5
    connectivity: 8
    # 相鄰前景像素的最大深度差（公尺）；0.0 恢復純二值連通域。
    depth_jump_threshold: 0.02
    min_component_area: 1000
    max_component_area: 30000
    filter_physical_size: false
    min_width: 0.015
    max_width: 0.3
    min_height: 0.015
    max_height: 0.3
    min_depth_size: 0.005
    max_depth_size: 0.2
    bbox_padding_ratio: 0.000001
